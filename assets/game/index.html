<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Wayki Combi · GoWayki</title><link rel="stylesheet" href="style.css"><script src="game.js" defer></script></head>
<body><main><header><div><span class="eyebrow">GOWAYKI · OFFLINE</span><h1>Wayki Combi</h1></div><button id="sound" aria-pressed="false">Sonido: no</button></header>
<div class="hud" aria-live="off"><span id="score">0 pts</span><span id="coins">S/ 0</span><span id="lives">♥ ♥ ♥</span><span id="time">90 s</span></div>
<section class="stage" aria-label="Juego de tres carriles"><canvas id="road" width="360" height="560" tabindex="0" aria-label="Recoge pasajeros y monedas. Evita obstáculos. Usa flechas, A y D o desliza."></canvas>
<div class="overlay" id="overlay"><div class="panel"><p class="eyebrow" id="badge">RUMBO AL MISTI</p><h2 id="heading">Tu combi, tu camino</h2><p id="info">Pasajeros +10 · monedas S/ 1.<br>Esquiva baches, conos y autos.</p><div id="selection"><div class="selector"><button id="previous" aria-label="Combi anterior">‹</button><img id="preview" width="96" height="96" alt="Combi seleccionada"><button id="next" aria-label="Combi siguiente">›</button></div><p id="busName"></p><p id="unlock" class="small"></p></div><button id="play" class="primary" disabled>Cargando…</button><p id="best" class="small">Récord local: 0</p></div></div>
</section><nav class="controls" aria-label="Controles"><button id="left" aria-label="Carril izquierdo">←</button><button id="pause" disabled>Pausa</button><button id="right" aria-label="Carril derecho">→</button></nav><p class="hint" id="hint">Desliza o usa ← → / A D · hasta 90 segundos</p><p class="small player" id="player">Conduce a tu ritmo</p><p id="status" role="status" class="small"></p></main></body></html>
