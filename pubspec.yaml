name: gowayki_lab
description: >
  Laboratorio académico TECSUP — interfaces de Gowayki GO + mapa MapLibre
  offline con rutas GTFS de Arequipa. Sin motores comerciales.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  shared_preferences: ^2.5.3
  maplibre_gl: ^0.27.1
  path_provider: ^2.1.5
  geolocator: ^14.1.1
  sqlite3: 3.9.0
  crypto: 3.0.8
  path: 1.9.1
  flutter_riverpod: 3.4.3
  go_router: 18.1.3
  url_launcher: 6.3.3
  share_plus: 13.3.1
  flutter_local_notifications: 22.3.3
  webview_flutter: 4.14.1
  google_sign_in: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/map/
    - assets/map/fonts/Noto Sans Bold/
    - assets/map/fonts/Noto Sans Italic/
    - assets/map/fonts/Noto Sans Regular/
    - assets/city/arequipa/
    - assets/game/
    - assets/game/sprites/
    - assets/brand/
    - assets/illustrations/micros/
