name: gowayki_lab
description: >
  Laboratorio académico TECSUP — interfaces de Gowayki GO + mapa MapLibre
  offline con rutas GTFS de Arequipa. Sin motores comerciales.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  shared_preferences: ^2.5.3
  maplibre_gl: ^0.27.1
  path_provider: ^2.1.5
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/map/fonts/Noto Sans Bold/
    - assets/map/fonts/Noto Sans Italic/
    - assets/map/fonts/Noto Sans Regular/
    - assets/gtfs/
